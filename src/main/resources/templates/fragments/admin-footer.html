<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="adminFooter">

    <style>
        .admin-footer {
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            color: #777;
            font-size: 13px;

        @media (max-width: 600px) {
            .admin-footer {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>

    <footer class="admin-footer">

        <p>Admin Management Panel</p>
    </footer>

</th:block>
