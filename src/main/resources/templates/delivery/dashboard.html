
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Partner Dashboard | Gavai Swad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7f2;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #174d35;
        }

        .navbar-brand {
            color: #fff;
            font-weight: bold;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #174d35, #28784f);
            color: white;
            padding: 30px;
            border-radius: 15px;
        }

        .order-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .status {
            background: #fff1c9;
            color: #805b00;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand">Gavai Swad - Delivery Panel</span>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-outline-light btn-sm" type="submit">
            Logout
        </button>
    </form>
</nav>

<div class="container py-4">

    <div class="dashboard-header mb-4">
        <h3>Welcome, <span th:text="${deliveryPartner.fullName}">Partner</span>!</h3>
        <p class="mb-0">Manage your assigned deliveries here.</p>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>My Assigned Orders</h4>
        <span class="badge bg-success"
              th:text="${#lists.size(orders)} + ' Orders'">
            0 Orders
        </span>
    </div>

    <div th:if="${#lists.isEmpty(orders)}"
         class="alert alert-info">
        No orders assigned to you yet.
    </div>

    <div class="row g-3">

        <div class="col-md-6 col-lg-4"
             th:each="order : ${orders}">

            <div class="card order-card h-100">
                <div class="card-body">

                    <div class="d-flex justify-content-between mb-3">
                        <h5>
                            Order #<span th:text="${order.id}"></span>
                        </h5>

                        <span class="status"
                              th:text="${order.orderStatus}">
                            PLACED
                        </span>
                    </div>

                    <p class="mb-1">
                        <strong>Customer:</strong>
                        <span th:text="${order.fullName}"></span>
                    </p>

                    <p class="mb-1">
                        <strong>Phone:</strong>
                        <span th:text="${order.phone}"></span>
                    </p>

                    <p class="mb-1">
                        <strong>Address:</strong>
                        <span th:text="${order.deliveryAddress}"></span>
                    </p>

                    <p class="mb-1">
                        <strong>Amount:</strong>
                        ₹<span th:text="${order.totalAmount}"></span>
                    </p>

                    <p class="mb-3">
                        <strong>Order Date:</strong>
                        <span th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}"></span>
                    </p>

                    <hr>

                    <p class="text-muted small mb-0">
                        Delivery actions will be available here in the next step.
                    </p>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
