<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{fragments/header :: head(~{::title}, '/css/products.css')}">
	    <title>Shop Products | Gavai Swad</title>
		
		<style>

			/* =================================
			   GAVAI SWAD PREMIUM SHOP DESIGN
			   Glassmorphism + Animations
			================================= */

			/* Hero Animation */

			.hero {
			    position: relative;
			    overflow: hidden;
			    background:
			        radial-gradient(circle at 10% 20%,
			        rgba(218, 174, 75, .18), transparent 30%),
			        linear-gradient(135deg, #e9f1e2, #f8f5e9);
			    animation: shopFadeIn .8s ease both;
			}

			.hero h1 {
			    animation: shopFadeUp .7s ease both;
			}

			.hero p {
			    animation: shopFadeUp .9s ease both;
			}

			/* Glass Filter */

			.filter-form {
			    background: rgba(255,255,255,.68);
			    backdrop-filter: blur(16px);
			    -webkit-backdrop-filter: blur(16px);
			    border: 1px solid rgba(255,255,255,.85);
			    border-radius: 18px;
			    box-shadow: 0 10px 30px rgba(37,83,48,.08);
			    transition: all .35s ease;
			}

			.filter-form:hover {
			    box-shadow: 0 15px 35px rgba(37,83,48,.13);
			    transform: translateY(-3px);
			}

			.filter-form input,
			.filter-form select {
			    background: rgba(255,255,255,.8);
			    transition: all .3s ease;
			}

			.filter-form input:focus,
			.filter-form select:focus {
			    border-color: #285c36;
			    box-shadow: 0 0 0 4px rgba(40,92,54,.1);
			    outline: none;
			}

			/* Product Cards */

			.product-card {
			    position: relative;
			    border-radius: 18px;
			    overflow: hidden;
			    background: rgba(255,255,255,.75);
			    backdrop-filter: blur(12px);
			    -webkit-backdrop-filter: blur(12px);
			    border: 1px solid rgba(255,255,255,.9);
			    box-shadow: 0 8px 25px rgba(37,83,48,.07);
			    animation: shopFadeUp .7s ease both;
			    transition: transform .4s ease, box-shadow .4s ease;
			}

			.product-card:hover {
			    transform: translateY(-10px);
			    box-shadow: 0 18px 38px rgba(37,83,48,.16);
			}

			.product-image {
			    height: 210px;
			    overflow: hidden;
			    background: #edf2e7;
			}

			.product-image img {
			    transition: transform .6s ease;
			}

			.product-card:hover .product-image img {
			    transform: scale(1.1);
			}

			.product-content {
			    padding: 20px;
			}

			.category-label {
			    display: inline-block;
			    color: #a27b2b;
			    font-weight: 800;
			    letter-spacing: 1.2px;
			}

			.product-content h3 {
			    color: #245b35;
			    font-weight: 800;
			}

			.price {
			    color: #285c36;
			    font-size: 23px;
			}

			/* Add to Cart */

			.add-to-cart-btn {
			    border-radius: 9px;
			    background: linear-gradient(135deg,#285c36,#397849);
			    box-shadow: 0 5px 15px rgba(40,92,54,.15);
			    transition: all .3s ease;
			}

			.add-to-cart-btn:hover:not(:disabled) {
			    background: linear-gradient(135deg,#1d4528,#285c36);
			    transform: translateY(-3px);
			    box-shadow: 0 9px 20px rgba(40,92,54,.22);
			}

			/* Empty State */

			.empty-state {
			    background: rgba(255,255,255,.75);
			    backdrop-filter: blur(14px);
			    border: 1px solid rgba(255,255,255,.9);
			    border-radius: 18px;
			    box-shadow: 0 10px 30px rgba(37,83,48,.08);
			    animation: shopFadeUp .7s ease both;
			}

			/* Animations */

			@keyframes shopFadeUp {
			    from {
			        opacity: 0;
			        transform: translateY(25px);
			    }
			    to {
			        opacity: 1;
			        transform: translateY(0);
			    }
			}

			@keyframes shopFadeIn {
			    from { opacity: 0; }
			    to { opacity: 1; }
			}

			/* Responsive */

			@media(max-width:550px) {
			    .product-image {
			        height: 190px;
			    }

			    .filter-form {
			        padding: 15px;
			    }
			}

			@media(prefers-reduced-motion:reduce) {
			    .product-card,
			    .hero,
			    .hero h1,
			    .hero p {
			        animation: none;
			        transition: none;
			    }
			}

		</style>
	</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <h1>Gaon Ka Swad, Aapke Ghar Tak</h1>
    <p>Discover traditional homemade foods, authentic spices and village favourites.</p>
</section>

<main class="container">

    <!-- Advanced Search and Filters -->
    <form class="filter-form"
          th:action="@{/products}"
          method="get">

        <input type="text"
               name="search"
               placeholder="Search products..."
               th:value="${search}">

        <select name="category">
            <option value="">All Categories</option>

            <option value="Achar" th:selected="${selectedCategory == 'Achar'}">Achar</option>
            <option value="Papad" th:selected="${selectedCategory == 'Papad'}">Papad</option>
            <option value="Masale" th:selected="${selectedCategory == 'Masale'}">Masale</option>
            <option value="Ghee" th:selected="${selectedCategory == 'Ghee'}">Ghee</option>
            <option value="Namkeen" th:selected="${selectedCategory == 'Namkeen'}">Namkeen</option>
            <option value="Homemade Foods" th:selected="${selectedCategory == 'Homemade Foods'}">Homemade Foods</option>
        </select>

        <input type="number"
               name="minPrice"
               placeholder="Min Price ₹"
               min="0"
               step="0.01"
               th:value="${minPrice}">

        <input type="number"
               name="maxPrice"
               placeholder="Max Price ₹"
               min="0"
               step="0.01"
               th:value="${maxPrice}">

        <button type="submit">Apply Filters</button>

        <a class="clear-button" th:href="@{/products}">
            Clear Filters
        </a>

    </form>

    <!-- Validation Error -->
    <div th:if="${error}"
         class="error"
         th:text="${error}">
    </div>

    <!-- Product Listing -->
    <h2 class="section-title">Explore Our Products</h2>

    <div class="product-grid"
         th:if="${!#lists.isEmpty(products)}">

        <article class="product-card"
                 th:each="product : ${products}">

            <div class="product-image">

                <img th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}"
                     th:src="${product.imageUrl}"
                     th:alt="${product.name}">

                <span th:unless="${product.imageUrl != null and !product.imageUrl.isBlank()}">
                    Gavai Swad
                </span>

            </div>

            <div class="product-content">

                <span class="category-label"
                      th:text="${product.category}"></span>

                <h3 th:text="${product.name}"></h3>

                <p class="description"
                   th:text="${product.description != null and !product.description.isBlank()
                   ? product.description : 'Traditional taste made with care.'}">
                </p>

                <div class="price">
                    ₹<span th:text="${product.price}"></span>
                </div>

                <p th:if="${product.stock != null and product.stock > 0}"
                   class="stock"
                   th:text="'In stock: ' + ${product.stock}">
                </p>

                <p th:if="${product.stock == null or product.stock <= 0}"
                   class="stock out-of-stock">
                    Out of stock
                </p>

            </div>

            <!-- Add to Cart: Only inside product loop -->
            <form th:action="@{/cart/add}" method="post">

                <input type="hidden"
                       name="productId"
                       th:value="${product.id}">

                <button type="submit"
                        class="add-to-cart-btn"
                        th:disabled="${product.stock == null or product.stock <= 0 or !product.active}">

                    <span th:if="${product.stock != null and product.stock > 0 and product.active}">
                        Add to Cart
                    </span>

                    <span th:unless="${product.stock != null and product.stock > 0 and product.active}">
                        Out of Stock
                    </span>

                </button>

            </form>

        </article>

    </div>

    <!-- Empty State: Only once -->
    <div class="empty-state"
         th:if="${#lists.isEmpty(products)}">

        <h3>No products found</h3>

        <p>Try another search or category.</p>

        <a class="clear-button" th:href="@{/products}">
            View All Products
        </a>

    </div>

</main>
<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
